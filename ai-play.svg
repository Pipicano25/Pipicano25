<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d2230"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" rx="20" fill="url(#bg)"/>

  <!-- ============ NETWORK EDGES ============ -->
  <g stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1.2">
    <line x1="430" y1="90" x2="610" y2="70"/><line x1="430" y1="90" x2="610" y2="115"/>
    <line x1="430" y1="90" x2="610" y2="160"/><line x1="430" y1="90" x2="610" y2="205"/>
    <line x1="430" y1="130" x2="610" y2="70"/><line x1="430" y1="130" x2="610" y2="115"/>
    <line x1="430" y1="130" x2="610" y2="160"/><line x1="430" y1="130" x2="610" y2="205"/>
    <line x1="430" y1="170" x2="610" y2="70"/><line x1="430" y1="170" x2="610" y2="115"/>
    <line x1="430" y1="170" x2="610" y2="160"/><line x1="430" y1="170" x2="610" y2="205"/>
    <line x1="610" y1="70" x2="780" y2="130"/><line x1="610" y1="115" x2="780" y2="130"/>
    <line x1="610" y1="160" x2="780" y2="130"/><line x1="610" y1="205" x2="780" y2="130"/>
  </g>

  <!-- ============ NETWORK NODES ============ -->
  <g>
    <circle cx="430" cy="90" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="430" cy="130" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="430" cy="170" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="610" cy="70" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="610" cy="115" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="610" cy="160" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="610" cy="205" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- ============ OUTPUT (prediction) ============ -->
  <g>
    <circle cx="780" cy="130" r="16" fill="#111a38" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="r" values="16;19;16" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M783,112 L769,135 L777,135 L773,151 L788,128 L780,128 Z" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ DATA DOTS (flow through network) ============ -->
  <circle cx="430" cy="90" r="5" fill="#67e8f9" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0s" path="M430,90 L610,70 L780,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="430" cy="130" r="5" fill="#67e8f9" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0.6s" path="M430,130 L610,160 L780,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="430" cy="170" r="5" fill="#67e8f9" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.2s" path="M430,170 L610,205 L780,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="430" cy="90" r="5" fill="#a5b4fc" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.8s" path="M430,90 L610,115 L780,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="1.8s"/>
  </circle>
  <circle cx="430" cy="130" r="5" fill="#a5b4fc" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="2.4s" path="M430,130 L610,70 L780,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="2.4s"/>
  </circle>

  <!-- ============ STAGE LABELS (pulse in sequence) ============ -->
  <text x="430" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#22d3ee">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="0s" repeatCount="indefinite"/>DATA
  </text>
  <text x="610" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#fbbf24">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="1s" repeatCount="indefinite"/>MODEL
  </text>
  <text x="780" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#a5b4fc">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="2s" repeatCount="indefinite"/>DEPLOY
  </text>

  <!-- ============ TOOL CHIPS: DATA COLUMN ============ -->
  <g font-size="13" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    <rect x="397" y="255" width="67" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="272">Pandas</text>
    <rect x="400" y="289" width="60" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="306">NumPy</text>
    <rect x="393" y="323" width="74" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="340">PySpark</text>
    <rect x="407" y="357" width="46" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="374">SQL</text>
    <rect x="393" y="391" width="74" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="408">Jupyter</text>
    <rect x="390" y="425" width="80" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="442">Power BI</text>
    <rect x="383" y="459" width="94" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="476">PostgreSQL</text>
    <rect x="397" y="493" width="67" height="26" rx="13" fill="#0d2230" stroke="#22d3ee" stroke-width="1"/><text x="430" y="510">Oracle</text>
  </g>

  <!-- ============ TOOL CHIPS: MODEL COLUMN ============ -->
  <g font-size="13" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    <rect x="577" y="255" width="67" height="26" rx="13" fill="#0d2230" stroke="#fbbf24" stroke-width="1"/><text x="610" y="272">Python</text>
    <rect x="560" y="289" width="101" height="26" rx="13" fill="#0d2230" stroke="#fbbf24" stroke-width="1"/><text x="610" y="306">scikit-learn</text>
    <rect x="573" y="323" width="74" height="26" rx="13" fill="#0d2230" stroke="#fbbf24" stroke-width="1"/><text x="610" y="340">PyTorch</text>
    <rect x="577" y="357" width="67" height="26" rx="13" fill="#0d2230" stroke="#fbbf24" stroke-width="1"/><text x="610" y="374">OpenCV</text>
    <rect x="584" y="391" width="53" height="26" rx="13" fill="#0d2230" stroke="#fbbf24" stroke-width="1"/><text x="610" y="408">YOLO</text>
  </g>

  <!-- ============ TOOL CHIPS: DEPLOY COLUMN ============ -->
  <g font-size="13" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    <rect x="747" y="255" width="67" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="272">Docker</text>
    <rect x="750" y="289" width="60" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="306">Azure</text>
    <rect x="757" y="323" width="46" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="340">Git</text>
    <rect x="720" y="357" width="121" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="374">GitHub Actions</text>
    <rect x="750" y="391" width="60" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="408">Flask</text>
    <rect x="747" y="425" width="67" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="442">Django</text>
    <rect x="747" y="459" width="67" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="476">UiPath</text>
    <rect x="740" y="493" width="80" height="26" rx="13" fill="#0d2230" stroke="#a5b4fc" stroke-width="1"/><text x="780" y="510">Selenium</text>
  </g>

  <!-- ============ LANGUAGES & WEB ROW ============ -->
  <text x="600" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">LANGUAGES &amp; WEB</text>
  <g font-size="13" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    <rect x="322" y="541" width="94" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="369" y="558">JavaScript</text>
    <rect x="432" y="541" width="94" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="479" y="558">TypeScript</text>
    <rect x="542" y="541" width="40" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="562" y="558">C#</text>
    <rect x="598" y="541" width="46" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="621" y="558">PHP</text>
    <rect x="660" y="541" width="53" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="687" y="558">HTML</text>
    <rect x="729" y="541" width="46" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="752" y="558">CSS</text>
    <rect x="791" y="541" width="87" height="26" rx="13" fill="#0d2230" stroke="#34d399" stroke-width="1"/><text x="835" y="558">Bootstrap</text>
  </g>

  <!-- ============ JAGUAR ============ -->
  <g>
    <!-- whole-body breathing bob -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0; 0 -3; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite"/>

    <!-- tail (wags) -->
    <g>
      <path d="M84,206 C 42,220 18,196 30,166" fill="none" stroke="#e0a64a" stroke-width="16" stroke-linecap="round"/>
      <circle cx="66" cy="200" r="5.5" fill="none" stroke="#2b2118" stroke-width="2.4"/>
      <circle cx="46" cy="192" r="4.5" fill="none" stroke="#2b2118" stroke-width="2.2"/>
      <circle cx="34" cy="178" r="3.8" fill="none" stroke="#2b2118" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 84 206; 14 84 206; 0 84 206; -14 84 206; 0 84 206" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- hind haunch + rear paw -->
    <ellipse cx="112" cy="214" rx="40" ry="42" fill="#d9983f"/>
    <ellipse cx="92" cy="248" rx="22" ry="11" fill="#e0a64a"/>

    <!-- body (crouching silhouette) -->
    <path d="M72,192 C 90,158 150,150 208,160 C 236,164 248,176 246,194 C 246,214 236,228 208,232 C 168,240 118,238 88,230 C 72,226 66,210 72,192 Z" fill="#e0a64a"/>
    <ellipse cx="170" cy="206" rx="44" ry="20" fill="#f2cf8f" opacity="0.55"/>

    <!-- rosettes on body (rings) -->
    <g fill="none" stroke="#2b2118" stroke-width="2.4">
      <circle cx="112" cy="180" r="5.5"/><circle cx="140" cy="172" r="5"/>
      <circle cx="175" cy="168" r="5.5"/><circle cx="205" cy="176" r="5"/>
      <circle cx="226" cy="190" r="4.5"/><circle cx="120" cy="212" r="5"/>
      <circle cx="158" cy="210" r="5.5"/><circle cx="192" cy="216" r="5"/>
      <circle cx="220" cy="214" r="4.5"/><circle cx="98" cy="200" r="4.5"/>
    </g>
    <g fill="#2b2118">
      <circle cx="112" cy="180" r="1.7"/><circle cx="140" cy="172" r="1.6"/>
      <circle cx="175" cy="168" r="1.7"/><circle cx="205" cy="176" r="1.6"/>
      <circle cx="226" cy="190" r="1.5"/><circle cx="120" cy="212" r="1.6"/>
      <circle cx="158" cy="210" r="1.7"/><circle cx="192" cy="216" r="1.6"/>
      <circle cx="220" cy="214" r="1.5"/><circle cx="98" cy="200" r="1.5"/>
    </g>

    <!-- front planted leg -->
    <ellipse cx="216" cy="224" rx="13" ry="27" fill="#d9983f"/>
    <ellipse cx="214" cy="252" rx="15" ry="8" fill="#f2cf8f"/>

    <!-- neck -->
    <ellipse cx="256" cy="172" rx="22" ry="26" fill="#e0a64a"/>

    <!-- head (looks around) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 276 140; 3 276 140; 0 276 140; -3 276 140; 0 276 140" dur="6s" repeatCount="indefinite"/>

      <circle cx="276" cy="140" r="34" fill="#e0a64a"/>

      <!-- ears -->
      <path d="258,112 260,76 288,104 Z" fill="#e0a64a"/>
      <path d="264,104 266,84 282,100 Z" fill="#2a201a"/>
      <path d="286,76 314,110 290,106 Z" fill="#e0a64a"/>
      <path d="290,82 306,102 292,102 Z" fill="#2a201a"/>

      <!-- forehead spots -->
      <circle cx="272" cy="96" r="2.6" fill="#2b2118"/>
      <circle cx="286" cy="104" r="2.4" fill="#2b2118"/>

      <!-- eyes (blink + look) -->
      <ellipse cx="264" cy="134" rx="6" ry="6" fill="#1f1a17">
        <animate attributeName="ry" values="6;6;0.8;6;6" keyTimes="0;0.42;0.5;0.58;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="264;266;264;262;264" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="290" cy="134" rx="6" ry="6" fill="#1f1a17">
        <animate attributeName="ry" values="6;6;0.8;6;6" keyTimes="0;0.42;0.5;0.58;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="290;292;290;288;290" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="262" cy="132" r="1.6" fill="#ffffff" fill-opacity="0.85"/>
      <circle cx="288" cy="132" r="1.6" fill="#ffffff" fill-opacity="0.85"/>

      <!-- muzzle, nose, mouth -->
      <ellipse cx="296" cy="154" rx="16" ry="11" fill="#f2cf8f"/>
      <path d="M288,152 304,152 296,159 Z" fill="#2a201a"/>
      <path d="M296,159 C 293,164 290,165 287,162 M296,159 C 299,164 302,165 305,162" fill="none" stroke="#1f1a17" stroke-width="2" stroke-linecap="round"/>

      <!-- whiskers -->
      <g stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none">
        <line x1="282" y1="152" x2="258" y2="148"/>
        <line x1="282" y1="158" x2="258" y2="162"/>
        <line x1="312" y1="152" x2="334" y2="148"/>
        <line x1="312" y1="158" x2="334" y2="162"/>
      </g>
    </g>

    <!-- raised front leg (bats) -->
    <g>
      <path d="M238,182 L290,150" stroke="#e0a64a" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="293" cy="148" rx="14" ry="10" fill="#e0a64a"/>
      <animateTransform attributeName="transform" type="rotate" values="0 238 182; -28 238 182; 0 238 182; -28 238 182; 0 238 182" keyTimes="0;0.25;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ============ DATA BALL (jaguar bats it into the network) ============ -->
  <circle r="8" fill="#22d3ee" opacity="0">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.3s" path="M300,170 Q 355,120 430,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.7;0.9" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
</svg>
