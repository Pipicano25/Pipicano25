<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d2230"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>

  <!-- network edges -->
  <g stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1.2">
    <line x1="380" y1="110" x2="560" y2="90"/><line x1="380" y1="110" x2="560" y2="145"/>
    <line x1="380" y1="110" x2="560" y2="200"/><line x1="380" y1="110" x2="560" y2="255"/>
    <line x1="380" y1="160" x2="560" y2="90"/><line x1="380" y1="160" x2="560" y2="145"/>
    <line x1="380" y1="160" x2="560" y2="200"/><line x1="380" y1="160" x2="560" y2="255"/>
    <line x1="380" y1="210" x2="560" y2="90"/><line x1="380" y1="210" x2="560" y2="145"/>
    <line x1="380" y1="210" x2="560" y2="200"/><line x1="380" y1="210" x2="560" y2="255"/>
    <line x1="560" y1="90" x2="740" y2="160"/><line x1="560" y1="145" x2="740" y2="160"/>
    <line x1="560" y1="200" x2="740" y2="160"/><line x1="560" y1="255" x2="740" y2="160"/>
  </g>

  <!-- network nodes -->
  <g>
    <circle cx="380" cy="110" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="380" cy="160" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="380" cy="210" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="560" cy="90" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="560" cy="145" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="560" cy="200" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="560" cy="255" r="8" fill="#0d2230" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- output (prediction) star -->
  <g>
    <circle cx="740" cy="160" r="16" fill="#111a38" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="r" values="16;18;16" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <polygon points="740,150 743,156 750,156 745,161 747,168 740,164 733,168 735,161 730,156 737,156" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- data dots flowing through the network -->
  <circle cx="380" cy="110" r="5" fill="#67e8f9" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0s" path="M380,110 L560,90 L740,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="380" cy="160" r="5" fill="#67e8f9" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1s" path="M380,160 L560,145 L740,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="380" cy="210" r="5" fill="#67e8f9" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="2s" path="M380,210 L560,255 L740,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- labels -->
  <text x="380" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">DATA</text>
  <text x="560" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">MODEL</text>
  <text x="740" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">PREDICTION</text>

  <!-- ===== cat ===== -->

  <!-- tail (wags) -->
  <g>
    <path d="M105,220 C 55,232 32,205 44,174" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="0 105 220; 10 105 220; 0 105 220; -10 105 220; 0 105 220" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- body -->
  <ellipse cx="158" cy="220" rx="58" ry="48" fill="#f4a261"/>

  <!-- head -->
  <circle cx="190" cy="142" r="40" fill="#f4a261"/>

  <!-- ears -->
  <path d="163,112 165,58 192,98 Z" fill="#f4a261"/>
  <path d="170,102 172,66 190,96 Z" fill="#e76f51"/>
  <path d="212,58 218,112 192,98 Z" fill="#f4a261"/>
  <path d="212,66 210,102 190,96 Z" fill="#e76f51"/>

  <!-- eyes (blink) -->
  <ellipse cx="175" cy="136" rx="6" ry="6" fill="#1f1a17">
    <animate attributeName="ry" values="6;6;0.8;6;6" keyTimes="0;0.42;0.5;0.58;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="205" cy="136" rx="6" ry="6" fill="#1f1a17">
    <animate attributeName="ry" values="6;6;0.8;6;6" keyTimes="0;0.42;0.5;0.58;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="173" cy="134" r="1.8" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="203" cy="134" r="1.8" fill="#ffffff" fill-opacity="0.85"/>

  <!-- nose & mouth -->
  <path d="186,154 194,154 190,161 Z" fill="#e76f51"/>
  <path d="M190,161 C 187,166 184,167 181,164 M190,161 C 193,166 196,167 199,164" fill="none" stroke="#1f1a17" stroke-width="2" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="172" y1="152" x2="150" y2="148"/>
    <line x1="172" y1="158" x2="150" y2="162"/>
    <line x1="208" y1="152" x2="230" y2="148"/>
    <line x1="208" y1="158" x2="230" y2="162"/>
  </g>

  <!-- sitting paws -->
  <ellipse cx="172" cy="262" rx="17" ry="10" fill="#f4a261"/>
  <ellipse cx="204" cy="265" rx="16" ry="9" fill="#f4a261"/>

  <!-- raised paw (taps) -->
  <g>
    <ellipse cx="250" cy="172" rx="13" ry="9" fill="#f4a261"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0; 0 -8; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- data ball the cat bats (bounces) -->
  <circle cx="272" cy="162" r="8" fill="#22d3ee">
    <animate attributeName="cy" values="162;150;162" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
